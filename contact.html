<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
            <h1 style="text-align: center;"> Nhi's MI 349 Blog</h1>
    </header>
    <nav>
        <a href="index.html" target="home"> Home</a>
        <a href="about.html" target="other">About</a>
        <a href="contact.html" target="other">Contact</a>
    </nav>

    <section>
    <article>
        <h2>Contact Me</h2>
        <div class="contact">
        <form name= "contact_form" data-netlify="true" class="contact">
        <label for="name">Name:  <input type="text" name="name" required> </label>
        <label for="email">Email: <input type="email" name="email" required></label>
        

        <label for="reason">Reason for Contact: 
            <select id="reason" name="reason">
                <option value="hi">Saying hi</option>
                <option value="contractor">Looking for a contractor</option>
                <option value="interview">Interested in an interview</option>
            </select>
        </label>
        <label for="message">Message: <input type="message" name="message" rows="5" cols="40"></label>
        <div class="submit"><button type="submit">Submit</button></div>
        </form>
        </div>
    </article>
    </section>
</body>
</html>
